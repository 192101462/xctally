# xctally 云端自动构建（GitHub Actions）
# ============================================================
# 链路：改 RELEASE.md（版本号 + 更新说明）→ push gitee → 镜像同步到本仓库
#       → 本流水线自动触发：版本号比已发布的高就构建、签名、发布回
#       gitee Release 并更新 version.json → 手机检查更新即可升级。
#
# 一次性配置见 docs/ci-setup.md（镜像 + Secrets 清单）。
#
# 触发：
#   push main    发版主通道。版本号没变（普通代码提交）时流水线秒退不构建。
#   手动 Run     应急/重发用；填的版本号和更新说明优先于 RELEASE.md，
#                版本留空则只构建不发布（冒烟测试）。
#
# 注意【不要】用标签触发：发布脚本调 gitee API 建 Release 时会顺手创建
# 标签，镜像晚一步把它同步过来时会再次触发流水线——而且标签指向的是旧
# 提交（不含刚修好的流水线代码），白白重跑一遍还容易失败。
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.4）。留空 = 只构建不发布；填了则优先于 RELEASE.md'
        required: false
        default: ''
      notes:
        description: '更新说明（每行一条）。仅在版本号填了时使用，否则读 RELEASE.md'
        required: false
        default: ''
        type: string

jobs:
  # ── 鸿蒙 HAP：与安卓共用同一条发版流水线 ─────────────────────────────
  # 失败不阻塞安卓发版（continue-on-error）；产物经 artifact 交给发布步骤，
  # 挂到同一个 gitee Release（xctally-harmony-<版本>.hap）。
  build-harmony:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本没变（普通代码提交）就秒退，与安卓侧同一套决策
      - name: Decide release
        id: hver
        env:
          EV_NAME: ${{ github.event_name }}
        run: python tools/ci_decide.py >> "$GITHUB_OUTPUT"

      - name: Setup HarmonyOS SDK
        if: steps.hver.outputs.build == 'yes'
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821     # 与本机 DevEco 26.x 同代；升 SDK 记得清这套缓存
          cache: true

      - name: Install libGL
        if: steps.hver.outputs.build == 'yes'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      # 签名材料（AGC 发布证书三件套）从 Secrets 解出来，不进仓库
      - name: Decode signing material
        if: steps.hver.outputs.build == 'yes'
        run: |
          mkdir -p apps/harmony/.sign/release
          echo "${{ secrets.HOS_P12_B64 }}" | base64 -d > apps/harmony/.sign/release/qiyu-release.p12
          echo "${{ secrets.HOS_CER_B64 }}" | base64 -d > apps/harmony/.sign/release/qiyu-release.cer
          echo "${{ secrets.HOS_P7B_B64 }}" | base64 -d > apps/harmony/.sign/release/qiyu-release-profile.p7b
          ls -la apps/harmony/.sign/release/

      - name: Build HAP (unsigned)
        if: steps.hver.outputs.build == 'yes'
        run: |
          # CI 上剥离本机调试签名配置（证书路径是 Windows 本机的，不存在于
          # runner；正式签名在下一步用 hap-sign-tool 完成，hvigor 只需出未签名包）
          python - <<'PY'
          import re
          p = 'apps/harmony/build-profile.json5'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'"signingConfigs": \[[\s\S]*?\n    \],', '"signingConfigs": [],', s, count=1)
          s = re.sub(r'\s*"signingConfig": "default",', '', s, count=1)
          open(p, 'w', encoding='utf-8', newline='\n').write(s)
          print(open(p, encoding='utf-8').read()[:200])
          PY
          export DEVECO_SDK_HOME="${HOS_SDK_HOME:-/home/runner/ohos-sdk/command-line-tools/sdk}"
          cd apps/harmony
          chmod +x hvigorw
          ./hvigorw --mode module -p product=default -p module=entry@default assembleHap --analyze=normal --no-daemon
          ls -la entry/build/default/outputs/default/

      # hvigor 只认 DevEco 加密密码，正式签名走 SDK 自带 hap-sign-tool（明文）
      - name: Sign HAP (AGC release cert)
        if: steps.hver.outputs.build == 'yes'
        run: |
          VER="${{ steps.hver.outputs.version }}"
          SIGN_JAR="${HOS_SDK_HOME}/default/openharmony/toolchains/lib/hap-sign-tool.jar"
          java -jar "$SIGN_JAR" sign-app \
            -mode localSign \
            -keyAlias qiyuRelease -signAlg SHA256withECDSA \
            -appCertFile apps/harmony/.sign/release/qiyu-release.cer \
            -profileFile apps/harmony/.sign/release/qiyu-release-profile.p7b \
            -inFile apps/harmony/entry/build/default/outputs/default/entry-default-unsigned.hap \
            -keystoreFile apps/harmony/.sign/release/qiyu-release.p12 \
            -keyPwd "${{ secrets.HOS_SIGN_PWD }}" -keystorePwd "${{ secrets.HOS_SIGN_PWD }}" \
            -outFile "apps/harmony/entry/build/default/outputs/default/xctally-harmony-${VER:-dev}-signed.hap" \
            -profileSigned 1

      - name: Upload HAP artifact
        if: steps.hver.outputs.build == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: harmony-hap
          path: apps/harmony/entry/build/default/outputs/default/xctally-harmony-*-signed.hap
          if-no-files-found: error

  build-and-release:
    needs: build-harmony
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 鸿蒙 job 的产物（job 失败/秒退时没有文件，忽略即可，不阻塞安卓）
      - name: Get HarmonyOS HAP artifact
        uses: actions/download-artifact@v4
        with:
          name: harmony-hap
          path: harmony-out
        continue-on-error: true

      # chmod +x gradlew 会改文件可执行位；仓库在 Windows 上建的、gradlew 以
      # 非执行位入库，Linux 上 chmod 后就成了"未暂存修改"，发布回推时的
      # git rebase 会被它挡住。这里让 git 无视文件模式变化。
      - name: Ignore file-mode changes
        run: git config core.fileMode false

      # 发版决策：要不要发、发什么版本、更新说明是什么。
      # 输出 version / publish / build / reason / notes 四个结果门控后面所有步骤。
      - name: Decide release
        id: ver
        env:
          EV_NAME: ${{ github.event_name }}
          IN_VER: ${{ github.event.inputs.version }}
          IN_NOTES: ${{ github.event.inputs.notes }}
        run: python tools/ci_decide.py >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.ver.outputs.build == 'yes'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses + best-effort preinstall
        if: steps.ver.outputs.build == 'yes'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # runner 自带的 sdkmanager 索引可能偏旧，装不上新平台也不要紧：
          # 许可证已接受，下面 Gradle 会自动下载缺失的 SDK 组件
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0" \
            || echo "(preinstall skipped — gradle will auto-download)"

      # 版本号处理 + 产出 versionCode：ci_publish.py bump 负责改 build.gradle.kts
      - name: Bump versionCode / versionName
        if: steps.ver.outputs.publish == 'yes'
        run: |
          chmod +x apps/android/gradlew
          python tools/ci_publish.py bump "${{ steps.ver.outputs.version }}"

      - name: Decode signing keystore
        if: steps.ver.outputs.publish == 'yes'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > apps/android/release.jks
          cat > apps/android/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        if: steps.ver.outputs.build == 'yes'
        run: |
          cd apps/android
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      - name: Show build result
        if: steps.ver.outputs.build == 'yes'
        run: ls -la apps/android/app/build/outputs/apk/release/

      # 发布回 gitee：建 Release + 传 APK + 更新 version.json 并推回
      # （notes 走 env 避免 shell 引号/换行被吃掉）
      - name: Publish to Gitee
        if: steps.ver.outputs.publish == 'yes'
        run: |
          HAP_ARG=""
          HAP_FILE=$(ls harmony-out/xctally-harmony-*-signed.hap 2>/dev/null | head -1)
          if [ -n "$HAP_FILE" ]; then HAP_ARG="--hap $HAP_FILE"; fi
          python tools/ci_publish.py publish \
            --version "${{ steps.ver.outputs.version }}" \
            --apk apps/android/app/build/outputs/apk/release/app-release.apk \
            $HAP_ARG \
            --notes "$REL_NOTES"
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REL_NOTES: ${{ steps.ver.outputs.notes }}

      - name: Upload APK artifact (手动只构建/留档)
        if: steps.ver.outputs.build == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: xctally-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
