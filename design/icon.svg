<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    琪遇台账 · 应用图标
    图形取自 App 内"物品日均成本"那张贬值曲线：东西越用越便宜。
    终点那颗白点取「琪」（美玉）之意。
    蓝色与界面主色一致（也和对话悬浮球同色）。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#63A6FF"/>
      <stop offset="0.5" stop-color="#2C7BF6"/>
      <stop offset="1" stop-color="#0A55CC"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- 贬值曲线：东西越用越便宜（App 里物品详情那张图） -->
    <path d="M232 372 C 372 372, 452 648, 792 676"
          fill="none" stroke="#ffffff" stroke-width="64" stroke-linecap="round"/>
    <!-- 终点：一颗珠子（「琪」= 美玉） -->
    <circle cx="792" cy="676" r="70" fill="#ffffff"/>
    <circle cx="792" cy="676" r="29" fill="#2C7BF6"/>
  </g>
</svg>
